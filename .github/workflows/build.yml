name: Compilation et tests COBOL

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer GnuCOBOL
        run: sudo apt-get update && sudo apt-get install -y gnucobol

      - name: Compiler et exécuter la chaîne batch
        run: bash tests/run_local.sh

      - name: Vérifier la syntaxe des programmes CICS et DB2
        run: python3 tests/zos_syntax_check.py
